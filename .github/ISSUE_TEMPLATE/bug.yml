name: Bug report
description: Something behaves differently than it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The most useful bug report is one someone else can reproduce —
        everything below is aimed at that.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe? Paste exact output or a screenshot where you can.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps. If you can't reproduce it reliably, say so — that's useful too.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and version
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Logs, related issues, what you already tried.
    validations:
      required: false
